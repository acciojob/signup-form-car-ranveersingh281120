<!DOCTYPE html>
<html>
   <head>
      <link rel="stylesheet" href="styles.css">
   </head>
   <body>
      <!-- the entire body must be written by student -->
	   <form   method="post" >
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Name" required><br><br>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Email" required><br><br>
      <label for="gender">Gender
      <input type="radio" id="gender_m" name="gender"  required>male
      <input type="radio" id="gender_f" name="gender"  required>female
      </label><br><br>
      <label for="cars">Car Brands</label>
      <input  type="select" id="cars" name="cars" placeholder="--Please choose an option--"  required >  <br><br>
      <label for="age">Age</label>
      <input type="Number" id="age" name="name" placeholder="Age" required><br><br>
      <label for="dob">DOB</label>
      <input type="date" id="dob" name="dob" required><br><br>
      <label for="tel">Phone Number</label>
      <input type="tel" id="tel"  name="dob" placeholder="xxx-xxx-xxxx" ><br><br>
      <label for="password">Password</label>
      <input type="password" id="password"  name="password" placeholder="Password" required ><br><br>
      <label for="tos">I agree to the TOS</label>
      <input type="checkbox" id="tos"  name="tos" required  ><br><br>
	  <button>submit</button>
		</form>
      <script type="text/javascript" src="./script.js"></script>
   </body>
</html>
